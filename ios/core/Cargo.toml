[package]
name = "pergament-ios"
version = "1.8.0"
edition = "2024"
description = "Pergament core as a static library for the iOS shell"
license = "GPL-3.0-only"
publish = false

[lib]
name = "pergament_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
pergament = { path = "../..", default-features = false }
pergament-app-core = { path = "../../app-core" }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
