[package]
name = "pergament-app-core"
version = "1.8.0"
edition = "2024"
description = "Tauri-free app logic shared by the Pergament shells"
license = "GPL-3.0-only"
publish = false

[lib]
name = "pergament_app_core"

[dependencies]
pergament = { path = "..", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
rusqlite = "0.40.2"
tempfile = "3.27.0"
