[package]
name = "jwlinux-app"
version = "0.1.0"
edition = "2024"
description = "Desktop reader for jwlinux (Tauri)"
license = "GPL-3.0-only"

[lib]
name = "jwlinux_app"
crate-type = ["rlib"]

[[bin]]
name = "jwlinux-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
jwlinux = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3.27.0"
