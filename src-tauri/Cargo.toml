[package]
name = "pergament-app"
version = "1.2.0"
edition = "2024"
description = "Pergament desktop app (Tauri)"
license = "GPL-3.0-only"

[lib]
name = "pergament_app"
crate-type = ["rlib"]

[[bin]]
name = "pergament-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
pergament = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Serve the bundled frontend instead of the dev server; `tauri build` turns it on.
custom-protocol = ["tauri/custom-protocol"]
