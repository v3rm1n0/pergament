[package]
name = "jwlinux-gtk"
version = "0.1.0"
edition = "2024"
description = "GTK4/libadwaita reader for jwlinux"

[[bin]]
name = "jwlinux-gtk"
path = "src/main.rs"

[dependencies]
jwlinux = { path = ".." }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
webkit6 = "0.6.1"
async-channel = "2.5.0"
dirs = "7.0.0"
