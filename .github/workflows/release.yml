# Publishes a GitHub release for every semantic version tag (vX.Y.Z), made by
# scripts/release.sh. Nothing is built or uploaded: the release holds only the
# source code archives GitHub adds itself.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag is a semantic version and matches the manifests
        run: |
          [[ $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          scripts/versions.sh "${GITHUB_REF_NAME#v}"

      - name: Write release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "Pergament ${GITHUB_REF_NAME#v}"
          --notes-file notes.md
