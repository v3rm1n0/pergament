# Publishes a GitHub release for every semantic version tag (vX.Y.Z), made by
# scripts/release.sh. The release holds a zip with the binaries, the icons and
# an installer (scripts/bundle-install.sh), a .sha256 file for the zip, deb,
# rpm and AppImage packages and a flatpak bundle for Linux x86_64 with their
# .sha256 files, a portable Windows x86_64 zip and an Apple Silicon disk image,
# and the source code archives GitHub adds itself. The Linux zip and the
# AppImage also get a .sig file, the minisign signature the in-app updater
# checks against the public key in src-tauri/src/app_update.rs. The notes are
# the ones GitHub generates from the merged pull requests, with the install
# instructions in front. The debs of the last three releases are also published
# as a signed apt repository on GitHub Pages (scripts/package-apt.sh).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Only the jobs after "release" run, to get their artifacts as downloads
  # without tagging a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    # The oldest runner image that has WebKitGTK 4.1, so the binary runs on
    # as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is a semantic version and matches the manifests
        run: |
          [[ $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          scripts/versions.sh "${GITHUB_REF_NAME#v}"

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
          cargo build --release --locked -p pergament -p pergament-app --features pergament-app/custom-protocol

      - name: Package the zip and its hash
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Sign the zip for the in-app updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri signer sign target/package/*.zip

      - name: Write the text in front of the release notes
        run: scripts/release-notes.sh > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "Pergament ${GITHUB_REF_NAME#v}"
          --generate-notes
          --notes-file notes.md
          target/package/*.zip
          target/package/*.zip.sha256
          target/package/*.zip.sig

  # The deb, rpm and AppImage packages, built by the Tauri bundler on the same
  # old runner image as the zip. Added to the release the job above made (or
  # kept as build artifacts when started by hand).
  linux-packages:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev libsqlite3-dev appstream \
            gstreamer1.0-libav gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            libegl1 libgl1 rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2

      - name: Build the command line tool and give the bundler its suffixed copy
        run: |
          bun install --frozen-lockfile
          cargo build --release --locked -p pergament
          cp target/release/pergament target/release/pergament-x86_64-unknown-linux-gnu

      - name: Bundle deb, rpm and AppImage
        run: >
          bun run tauri build --bundles deb,rpm,appimage
          --config '{"bundle":{"active":true,"externalBin":["../target/release/pergament"]}}'

      - name: Check the deb metadata and the metainfo
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb | grep -E 'Depends:.*(libwebkit2gtk-4\.1-0|gstreamer1\.0-libav)'
          appstreamcli validate src-tauri/io.github.v3rm1n.pergament.metainfo.xml
          dpkg-deb --contents target/release/bundle/deb/*.deb | grep -Eq ' (\./)?usr/share/metainfo/io\.github\.v3rm1n\.pergament\.metainfo\.xml$'
          rpm -qlp target/release/bundle/rpm/*.rpm | grep -qx '/usr/share/metainfo/io.github.v3rm1n.pergament.metainfo.xml'
          scripts/test-deb-apt-files.sh target/release/bundle/deb/*.deb

      - name: Work out the version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Work out the version (builds without a tag)
        if: github.ref_type != 'tag'
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"

      - name: Name the artifacts and write their hashes
        run: scripts/package-bundles.sh "$version"

      - name: Sign the AppImage for the in-app updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri signer sign target/package/Pergament-*-linux-x86_64.AppImage

      - name: Keep them as build artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-packages
          path: target/package/*

      - name: Add them to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$GITHUB_REF_NAME" target/package/Pergament-*linux-x86_64.*

  # A single-file flatpak bundle from packaging/flatpak/, which only stages the
  # built files into the GNOME runtime sandbox. Added to the release the
  # release job made (or kept as a build artifact when started by hand).
  # Ubuntu 24.04, not 22.04: noble's flatpak-builder 1.4 calls appstreamcli
  # compose on the host, while jammy's 1.2 runs appstream-compose inside the
  # SDK, which the GNOME runtime no longer ships (Debian bug #1082763). The
  # flatpak runs against the runtime's own glibc, so the newer host is safe.
  flatpak:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev libsqlite3-dev flatpak flatpak-builder appstream appstream-compose elfutils librsvg2-common dbus-x11

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
          cargo build --release --locked -p pergament -p pergament-app --features pergament-app/custom-protocol

      - name: Install the GNOME runtime and SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          runtime=$(python3 -c 'import json; print(json.load(open("packaging/flatpak/io.github.v3rm1n.pergament.json"))["runtime-version"])')
          flatpak --user install -y flathub "org.gnome.Platform//$runtime" "org.gnome.Sdk//$runtime"

      - name: Work out the version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Work out the version (builds without a tag)
        if: github.ref_type != 'tag'
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"

      - name: Bundle the flatpak
        run: scripts/package-flatpak.sh "$version"

      - name: Smoke test from the local repo
        run: |
          flatpak --user install -y --reinstall "$PWD/target/flatpak-repo" io.github.v3rm1n.pergament
          dbus-run-session -- flatpak run --command=pergament io.github.v3rm1n.pergament --help

      - name: Keep it as a build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-flatpak
          path: target/package/*

      - name: Add it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$GITHUB_REF_NAME" target/package/Pergament-*linux-x86_64.flatpak*

  # An unsigned disk image for Apple Silicon, added to the release the job above
  # made. It is ad-hoc signed only (no Apple Developer ID, no notarization), so
  # macOS asks for confirmation on the first start.
  macos:
    needs: release
    # On a tag the release job has to succeed first; when started by hand it is skipped.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2

      - name: Build the disk image
        run: |
          bun install --frozen-lockfile
          bun run tauri build --bundles dmg --config '{"bundle":{"active":true,"icon":["icons/icon.icns"],"macOS":{"signingIdentity":"-"}}}'

      - name: Name it and write its hash
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-dev
          fi
          mkdir -p target/package
          cp target/release/bundle/dmg/*.dmg "target/package/Pergament-$version-macos-arm64.dmg"
          cd target/package
          shasum -a 256 ./*.dmg > "Pergament-$version-macos-arm64.dmg.sha256"

      - name: Keep it as a build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: target/package/*

      - name: Add it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$GITHUB_REF_NAME" target/package/*.dmg target/package/*.dmg.sha256

  # A portable Windows build, with no installer. The user extracts the zip and
  # runs pergament-app.exe; the WebView2 Runtime is required.
  windows:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build
          cargo build --release --locked -p pergament -p pergament-app --features pergament-app/custom-protocol

      - name: Package the portable zip and its hash
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          }
          $name = "Pergament-$version-windows-x86_64"
          $out = "target/package"
          $stage = Join-Path $out $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/pergament.exe, target/release/pergament-app.exe, LICENSE, README.md -Destination $stage
          $zip = Join-Path $out "$name.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -NoNewline "$zip.sha256"
          Get-ChildItem $out

      - name: Keep it as a build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-portable
          path: target/package/*

      - name: Add it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$GITHUB_REF_NAME" target/package/Pergament-*-windows-x86_64.*

  # The signed apt repository (scripts/package-apt.sh) with the debs of the last
  # three published releases, built after the deb of this one is on its release.
  # Kept as a build artifact when started by hand.
  apt-repo:
    needs: linux-packages
    if: ${{ !cancelled() && needs.linux-packages.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install apt-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          gnupg_home=$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")
          chmod 700 "$gnupg_home"
          printf '%s\n' "$APT_SIGNING_KEY" | GNUPGHOME=$gnupg_home gpg --batch --quiet --import
          # A key with a passphrase: gpg reads it from a file instead of asking
          # for it on a terminal, which the runner doesn't have.
          if [[ -n $APT_SIGNING_KEY_PASSPHRASE ]]; then
            (umask 077 && printf '%s' "$APT_SIGNING_KEY_PASSPHRASE" > "$gnupg_home/passphrase")
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$gnupg_home/passphrase" > "$gnupg_home/gpg.conf"
          fi
          # The first fpr line after the sec line is the primary key's.
          fingerprint=$(GNUPGHOME=$gnupg_home gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          [[ $fingerprint =~ ^[0-9A-F]{40}$ ]]
          echo "GNUPGHOME=$gnupg_home" >> "$GITHUB_ENV"
          echo "APT_KEY_ID=$fingerprint" >> "$GITHUB_ENV"

      # Fails when the secret is not the key behind packaging/apt/pergament.gpg,
      # before collect-debs, which dies while no release has a .deb.
      - name: Check the signing key against the committed public key
        run: echo test | gpg --batch --local-user "$APT_KEY_ID" --clearsign | gpgv --keyring "$PWD/packaging/apt/pergament.gpg"

      - name: Download the debs of the last releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/collect-debs.sh target/apt-debs

      - name: Build and sign the repository
        run: scripts/package-apt.sh target/apt-debs target/pages/apt

      # Fails when the secret is not the key behind packaging/apt/pergament.gpg.
      - name: Check the signature against the committed public key
        run: gpgv --keyring "$PWD/packaging/apt/pergament.gpg" target/pages/apt/InRelease

      - name: Keep it as a build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: apt-repo
          path: target/pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  # Puts the repository on GitHub Pages. A separate job because the
  # environment is set per job; only tags publish. To retry, re-run apt-repo
  # (which re-runs this job), not apt-deploy alone: a lone re-run deploys that
  # run's stored artifact and could replace a newer repository.
  apt-deploy:
    needs: apt-repo
    if: ${{ !cancelled() && needs.apt-repo.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
