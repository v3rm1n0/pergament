# Builds the Android and iOS apps on demand and keeps them as workflow
# artifacts. Nothing is published: the apps are unsigned debug builds for your
# own testing (see README, "Mobile apps").
name: Mobile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mobile.yml"
      - "scripts/mobile.sh"
      - "src-tauri/**"
      - "Cargo.*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: scripts/mobile.sh android --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: pergament-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # An unsigned IPA for sideloading: SideStore, AltStore or Sideloadly sign it
  # with your own Apple ID when you install it.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: |
          rustup target add aarch64-apple-ios
          pnpm install --frozen-lockfile
          pnpm tauri ios init --ci
      - name: Turn code signing off in the Xcode project
        working-directory: src-tauri/gen/apple
        run: |
          python3 - <<'PY'
          import re
          text = open("project.yml").read()
          text, n = re.subn(
              r"^(\s*)base:[ \t]*$",
              r'\1base:\n\1  CODE_SIGNING_ALLOWED: "NO"\n\1  CODE_SIGNING_REQUIRED: "NO"\n\1  CODE_SIGN_IDENTITY: ""',
              text,
              flags=re.M,
          )
          assert n, "no settings.base block in project.yml"
          open("project.yml", "w").write(text)
          PY
          xcodegen generate
      # The export step needs a signing identity and is expected to fail; the
      # archive it leaves behind is what gets packaged.
      - run: pnpm tauri ios build --debug --target aarch64 --ci || true
      - name: Package the IPA
        run: |
          app=$(find src-tauri/gen/apple -path '*.xcarchive/Products/Applications/*.app' -maxdepth 8 | head -n1)
          [[ -n $app ]] || { echo "no archive was produced" >&2; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../Pergament-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: pergament-ios-unsigned-ipa
          path: Pergament-unsigned.ipa
