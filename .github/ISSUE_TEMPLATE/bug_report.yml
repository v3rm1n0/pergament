name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug here.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Pergament are you running?
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package or installation method
      placeholder: e.g. deb, AppImage, Windows zip, Nix, source
  - type: markdown
    attributes:
      value: Please remove personal data and publication text from logs and screenshots before sharing them.
  - type: textarea
    id: steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
  - type: textarea
    id: logs
    attributes:
      label: Additional details or sanitized logs
      description: Include relevant errors and say whether the issue reproduces with invented or user-supplied material. Do not include private data or publication content.
