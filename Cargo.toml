[workspace]
members = [".", "src-tauri"]

[package]
name = "pergament"
version = "1.7.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
aes = "0.9.3"
ammonia = "4.2.1"
anyhow = { version = "1.0.104", optional = true }
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
dirs = "7.0.0"
flate2 = "1.1.10"
gethostname = "1.1.0"
hex = "0.4.3"
lol_html = "3.0.1"
md-5 = "0.11.0"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Windows has no system SQLite to link against, so build it in.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[features]
default = ["cli"]
# The command line tool; the app leaves it out, so its builds skip clap.
cli = ["dep:anyhow", "dep:clap"]

[[bin]]
name = "pergament"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
hex = "0.4.3"
