[workspace]
members = [".", "src-tauri"]

[package]
name = "pergament"
version = "1.0.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
aes = "0.9.3"
ammonia = "4.2.1"
anyhow = "1.0.104"
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
lol_html = "3.0.1"
md-5 = "0.11.0"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }


[[bin]]
name = "pergament"
path = "src/main.rs"

[dev-dependencies]
hex = "0.4.3"
